[project]
name = "sentrik"
version = "0.1.0"
description = "Authorized autonomous application & API security testing platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "PyYAML>=6.0",
    # Every runtime dependency is required — nothing is optional. The platform still keeps
    # its deterministic fallbacks (e.g. rule-based brain when no API key is set), but the
    # supporting libraries are always installed so every import resolves.
    # Agent frameworks
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "deepagents>=0.7",
    # Protocols
    "a2a-sdk>=1.1.5",  # Sentrik is an A2A agent (/a2a, agent card)
    "mcp>=2.2",  # MCP tool server over streamable-HTTP at /mcp
    "dnspython>=2.4",
    # Postgres, object storage, observability
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "trio>=0.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Ensure the project root is importable so tests can `from tests.conftest import …`
# and cross-import fixtures regardless of the invoking directory / import mode.
pythonpath = ["."]
# Only collect test functions; do NOT auto-collect domain classes named Test* (TestAccount, TestIntensity).
python_classes = "_DisabledClassCollection"
filterwarnings = ["ignore::DeprecationWarning"]
